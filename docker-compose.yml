version: "3.9"

services:
  reviewer-cli:
    build: .
    image: reviewer:latest
    environment:
      - ANTHROPIC_API_KEY
      - GITHUB_TOKEN
      - LLM_MODEL
      - LANGCHAIN_TRACING_V2
      - LANGCHAIN_API_KEY
      - LANGCHAIN_PROJECT

  reviewer-api:
    build: .
    image: reviewer:latest
    command:
      - uvicorn
      - reviewer.api:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"
    ports:
      - "8000:8000"
    environment:
      - ANTHROPIC_API_KEY
      - GITHUB_TOKEN
      - LLM_MODEL
      - LANGCHAIN_TRACING_V2
      - LANGCHAIN_API_KEY
      - LANGCHAIN_PROJECT
