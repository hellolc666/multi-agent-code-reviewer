[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "reviewer"
version = "0.1.0"
description = "Multi-agent code reviewer for GitHub pull requests (Python repos, v1)."
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = { text = "MIT" }
authors = [{ name = "Om Solanki", email = "omsolankisde@gmail.com" }]

dependencies = [
    "anthropic>=0.40,<2.0",
    "langgraph>=0.2.34,<1.0",
    "langchain>=0.3.0,<1.0",
    "langchain-anthropic>=0.2.0,<1.0",
    "langchain-openai>=0.2.0,<1.0",
    "langsmith>=0.1.130,<1.0",
    "pydantic>=2.9,<3.0",
    "PyGithub>=2.4,<3.0",
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.30,<1.0",
    "httpx>=0.27,<1.0",
    "typer>=0.12,<1.0",
    "python-dotenv>=1.0,<2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<9.0",
    "pytest-asyncio>=0.24,<1.0",
    "ruff>=0.6,<1.0",
]

[project.scripts]
reviewer = "reviewer.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["reviewer"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
norecursedirs = ["fixtures"]
markers = [
    "live: hits real network / GitHub API; opt-in via env vars",
]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["tests/fixtures"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.reviewer]
test_dirs = ["tests"]
